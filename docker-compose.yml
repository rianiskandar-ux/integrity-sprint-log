services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: isl-postgres
    environment:
      POSTGRES_DB: isl
      POSTGRES_USER: isl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isl-local-2026}
    ports:
      - "127.0.0.1:5432:5432"     # localhost only — tidak accessible dari jaringan luar
    volumes:
      - isl-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isl -d isl"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  integrity-sprint-log:
    build: .
    container_name: integrity-sprint-log
    ports:
      - "4891:3000"
    # OpenProject is on the internal office network. Some Docker setups (esp.
    # Docker Desktop) use a public DNS that can't resolve the internal hostname,
    # so the container fails to reach OP even when the laptop itself can. Pin the
    # mapping here. Override OP_HOST_IP in .env if the OP server IP changes.
    extra_hosts:
      - "tokek.integrity-asia.com:${OP_HOST_IP:-10.30.40.147}"
      # Custom dns: di bawah bikin embedded DNS Docker kelewat — pin host gateway
      # manual supaya container bisa reach Ollama di host (embedding lokal).
      - "host.docker.internal:host-gateway"
    dns:
      - 10.30.40.42
      - 10.236.144.228
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Sprint markdown files — bind mount langsung dari host
      - ../daily-sprints:/app/daily-sprints
      # Google OAuth token & profile (per user)
      - isl-auth:/app/auth-data
      # user-config.json + op-cache.json (persisted across restarts)
      - isl-data:/app/data
      # Kredensial Claude Code (login akun kamu) → biar claude-cli jalan di container.
      # AI dipakai = akun pemilik kredensial ini. Tiap orang set CLAUDE_CREDS_DIR / CLAUDE_CONFIG_FILE
      # di .env ke folder .claude mereka sendiri (lihat .env.example + TEAM-SETUP.md).
      - ${CLAUDE_CREDS_DIR:-C:/Users/user199/.claude}:/home/nextjs/.claude
      # Config utama claude (.claude.json) read-only: container baca, host aman dari corrupt.
      - ${CLAUDE_CONFIG_FILE:-C:/Users/user199/.claude.json}:/home/nextjs/.claude.json:ro
      # Binary claude CLI di named volume → survive rebuild. Corporate network blokir
      # npm saat docker build, jadi install jalan sekali saat runtime (server-wrapper.js)
      # dan hasilnya persist di sini. Tidak perlu reinstall manual lagi tiap rebuild.
      - isl-claude-cli:/opt/claude-cli
    environment:
      - DATABASE_URL=postgresql://isl:${POSTGRES_PASSWORD:-isl-local-2026}@postgres:5432/isl
      - OP_BASE_URL=${OP_BASE_URL:-https://tokek.integrity-asia.com}
      - OP_PROJECT_ID=${OP_PROJECT_ID:-integritys-websites}
      - OP_API_TOKEN=${OP_API_TOKEN:-}
      - NEXTAUTH_URL=http://localhost:4891
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-isl-local-secret-2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_LOGIN_HINT=${GOOGLE_LOGIN_HINT:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:4891/api/auth/callback/google}
      - SPRINT_OUTPUT_DIR=/app/daily-sprints
      - AUTH_DATA_DIR=/app/auth-data
      - CACHE_DATA_DIR=/app/data
      # At-rest encryption for secrets in user-config.json (AES-256-GCM).
      # Override via .env for your own key. Changing it makes existing ciphertext unreadable.
      - ISL_ENCRYPTION_KEY=${ISL_ENCRYPTION_KEY:-isl-local-aes-key-change-me-2026}
      # Lightweight PIN gate. EMPTY = gate disabled (lockout-safe). Set to enable login.
      - ISL_ACCESS_PIN=${ISL_ACCESS_PIN:-}
      # Multi-user mode: tiap orang login pakai OP API token sendiri. 1 = aktif.
      - ISL_MULTIUSER=${ISL_MULTIUSER:-1}
      # OP user id pemilik instance — hanya dipakai kalau ISL_MULTIUSER=0 (single-user).
      - ISL_OP_USER_ID=${ISL_OP_USER_ID:-0}
      # Internal uid pemilik markdown lama (daily-sprints/). Default 1 = user pertama.
      - ISL_OWNER_UID=${ISL_OWNER_UID:-1}
      # Local key untuk perintah terminal `isl-timer.ps1` (kosong = pakai ISL_ENCRYPTION_KEY).
      - ISL_TIMER_KEY=${ISL_TIMER_KEY:-}
      # Embedding lokal via Ollama di host (nomic-embed-text, 768 dim)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # AI Chat providers (server-side only, tidak expose ke client)
      - AI_CHAT_TR_KEY=${AI_CHAT_TR_KEY:-}
      - AI_CHAT_TR_BASE=${AI_CHAT_TR_BASE:-https://api.tokenrouter.com/v1}
      - AI_CHAT_OM_KEY=${AI_CHAT_OM_KEY:-}
      - AI_CHAT_OM_BASE=${AI_CHAT_OM_BASE:-https://api.openmodel.ai/v1}
    restart: unless-stopped

volumes:
  isl-pgdata:
  isl-auth:
  isl-data:
  isl-claude-cli:
